#cloud-config
package_update: true
packages:
  - jq
  - nginx

runcmd:
  - cp /tmp/index.html /usr/share/nginx/html/index.html
  - systemctl enable nginx
  - systemctl start nginx
  - systemctl status nginx

write_files:
  - path: /tmp/index.html
    permissions: '0644'
    content: |
     write_files:
  - path: /tmp/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EC2 | Cloud Infrastructure</title>

        <style>
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          }

          body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            background:
              radial-gradient(circle at top left, #312e81, transparent 40%),
              radial-gradient(circle at bottom right, #164e63, transparent 40%),
              #080b16;
            padding: 20px;
          }

          .container {
            width: 100%;
            max-width: 700px;
            padding: 50px 35px;
            text-align: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
          }

          .tag {
            display: inline-block;
            padding: 8px 16px;
            margin-bottom: 25px;
            border-radius: 30px;
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            font-size: 13px;
            letter-spacing: 1px;
          }

          .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 7px;
            border-radius: 50%;
            background: #4ade80;
          }

          h1 {
            font-size: clamp(32px, 6vw, 52px);
            margin-bottom: 18px;
            background: linear-gradient(90deg, #a78bfa, #38bdf8);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
          }

          .description {
            color: #a5b4cc;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 35px;
          }

          .info {
            padding: 20px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
          }

          .info h2 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
            font-weight: normal;
          }

          .info p {
            font-size: 20px;
            color: #e2e8f0;
          }

          .footer {
            color: #64748b;
            font-size: 13px;
          }
        </style>
      </head>

      <body>
        <main class="container">

          <div class="tag">
            <span class="dot"></span>
            SYSTEM ONLINE
          </div>

          <h1>Hello, Cloud!</h1>

          <p class="description">
            Welcome to my EC2 deployment.
            This website was automatically deployed using
            Terraform, AWS EC2 and Cloud-Init.
          </p>

          <div class="info">
            <h2>YOUR INFRASTRUCTURE</h2>
            <p>AWS EC2 | Amazon Linux 2023</p>
          </div>

          <div class="info">
            <h2>VISITOR LOCAL TIME</h2>
            <p id="clock">Loading...</p>
          </div>

          <p class="footer">
            Built and deployed with Terraform & Cloud-Init
          </p>

        </main>

        <script>
          function updateClock() {
            const now = new Date();

            document.getElementById("clock").textContent =
              now.toLocaleTimeString();
          }

          updateClock();
          setInterval(updateClock, 1000);
        </script>

      </body>
      </html>