#cloud-config
package_update: true
packages:
  - jq
  - nginx

runcmd:
  - cp /tmp/index.html /usr/share/nginx/html/index.html
  - systemctl enable nginx
  - systemctl start nginx
  - systemctl status nginx

write_files:
  - path: /tmp/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html>
        <head>
          <title>My EC2 Website</title>
        </head>
        <body>
          <h1>Hello from my EC2 instance!</h1>
        </body>
      </html>